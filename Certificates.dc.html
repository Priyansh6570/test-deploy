<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #FBF7F0; }
  * { box-sizing: border-box; }
  a { color: #27408B; text-decoration: none; }
  a:hover { color: #8A6015; }
  ::selection { background: #F1DFB6; color: #14203E; }
  button:focus-visible, a:focus-visible { outline: 3px solid #27408B; outline-offset: 2px; }
  @media (max-width: 980px) {
    [data-g="foot"] { grid-template-columns: minmax(0,1fr) !important; gap: 30px !important; }
    [data-e~="nav"], [data-e~="signin-top"] { display: none !important; }
    [data-e~="menu-btn"] { display: inline-flex !important; }
  }
  @media (max-width: 640px) {
    [data-e~="pad"] { padding-left: 18px !important; padding-right: 18px !important; }
    [data-e~="card"] { padding: 20px 16px !important; }
  }
</style>
<script src="assets/site.js"></script>
</helmet>

<div style="background:#FBF7F0;color:#161C2E;font-family:'Noto Sans Devanagari',system-ui,sans-serif;min-width:320px;overflow-x:hidden">
  <dc-import name="SiteHeader" lang="{{ lang }}" active="certificates" signed-in="{{ true }}" has-certificates="{{ true }}" on-toggle-lang="{{ toggleLang }}" hint-size="100%,68px"></dc-import>

  <section data-e="pad" style="max-width:900px;margin:0 auto;padding:48px 30px 78px">
    <h1 style="margin:0 0 26px;font-family:'Noto Serif Devanagari',serif;font-weight:600;font-size:clamp(25px,3.6vw,34px);line-height:1.3;color:#14203E">{{ t.title }}</h1>

    <div data-e="card" style="padding:26px;background:#FFFFFF;border-radius:22px;box-shadow:0 2px 4px rgba(20,32,62,.05),0 16px 34px rgba(20,32,62,.07)">
      <div style="position:relative;overflow:hidden;border-radius:14px;border:1px dashed #D9C79C;background:repeating-linear-gradient(135deg,#FFFDF7 0 14px,#FCF8ED 14px 28px);aspect-ratio:1.414/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:8%">
        <span aria-hidden="true" style="position:absolute;inset:3%;border:1px solid rgba(217,188,124,.55);border-radius:8px;pointer-events:none"></span>
        <span style="width:62px;height:62px;border-radius:50%;background:#F4EBD8;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="#8A6015" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><rect x="5" y="6" width="22" height="15" rx="2"></rect><circle cx="16" cy="24" r="3.4"></circle><path d="M10 11h12M10 15h7"></path></svg>
        </span>
        <p style="margin:0;font-family:'Noto Serif Devanagari',serif;font-weight:600;font-size:clamp(20px,2.4vw,26px);line-height:1.4;color:#14203E">{{ t.emptyTitle }}</p>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:22px">
        <button type="button" disabled="{{ true }}" style="min-height:54px;padding:15px 28px;border:0;border-radius:999px;background:#EDE6D7;color:#8B93A2;cursor:not-allowed;font-size:17px;font-weight:600;line-height:1.5;font-family:inherit">{{ t.download }}</button>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,320px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000}}">
const S = {
  hi: {
    title: "प्रमाण पत्र",
    emptyTitle: "प्रमाण पत्र अभी उपलब्ध नहीं",
    download: "PDF डाउनलोड करें"
  },
  en: {
    title: "Certificate",
    emptyTitle: "No certificate available yet",
    download: "Download PDF"
  }
};

class Component extends DCLogic {
  state = { lang: null };

  componentDidMount() {
    try { const saved = localStorage.getItem("skpn_lang"); if (saved === "hi" || saved === "en") this.setState({ lang: saved }); } catch (e) {}
  }

  get lang() { return this.state.lang || this.props.language || "hi"; }

  renderVals() {
    const lang = this.lang;
    return {
      lang: lang,
      t: S[lang],
      toggleLang: () => {
        const next = lang === "hi" ? "en" : "hi";
        try { localStorage.setItem("skpn_lang", next); } catch (e) {}
        this.setState({ lang: next });
      }
    };
  }
}

</script>
</body>
</html>
