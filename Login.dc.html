<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #FBF7F0; }
  * { box-sizing: border-box; }
  a { color: #27408B; text-decoration: none; }
  a:hover { color: #8A6015; }
  ::selection { background: #F1DFB6; color: #14203E; }
  input, button { font-family: 'Noto Sans Devanagari', system-ui, sans-serif; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #27408B; outline-offset: 2px; }
  @keyframes lg-inA { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes lg-inB { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes lg-glow { 0%,100% { opacity:.3; transform:scale(1); } 50% { opacity:.75; transform:scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  @media (max-width: 900px) {
    [data-e~="split"] { grid-template-columns: minmax(0,1fr) !important; }
    [data-e~="aside"] { min-height: 0 !important; padding: 18px 20px !important; gap: 14px !important; }
    [data-e~="asidebody"] { display: none !important; }
    [data-e~="asideslide"] { flex-direction: row !important; align-items: center !important; gap: 12px !important; }
    [data-e~="slidevalue"] { font-size: 20px !important; }
  }
  @media (max-width: 980px) {
    [data-g="foot"] { grid-template-columns: minmax(0,1fr) !important; gap: 30px !important; }
    [data-e~="nav"], [data-e~="signin-top"] { display: none !important; }
    [data-e~="menu-btn"] { display: inline-flex !important; }
  }
  @media (max-width: 640px) {
    [data-e~="pad"] { padding-left: 14px !important; padding-right: 14px !important; }
    [data-e~="form"] { padding: 26px 20px !important; }
  }
</style>
<script src="assets/site.js"></script>
</helmet>

<div style="background:#FBF7F0;color:#161C2E;font-family:'Noto Sans Devanagari',system-ui,sans-serif;min-width:320px;overflow-x:hidden">
  <dc-import name="SiteHeader" lang="{{ lang }}" active="home" on-toggle-lang="{{ toggleLang }}" hint-size="100%,68px"></dc-import>

  <section data-e="pad" style="max-width:1080px;margin:0 auto;padding:40px 30px 80px">
    <div data-e="split" style="display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);border-radius:26px;overflow:hidden;box-shadow:0 2px 6px rgba(20,32,62,.06),0 22px 52px rgba(20,32,62,.14);align-items:stretch">

      <aside data-e="aside" style="position:relative;overflow:hidden;background:#070B1E;min-height:500px;padding:36px 34px;display:flex;flex-direction:column;gap:24px">
        <img src="assets/cosmic-halo.png" alt="" width="924" height="540" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;opacity:.5" />
        <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(170deg, rgba(7,11,30,.5) 0%, rgba(7,11,30,.87) 54%, rgba(5,8,22,.97) 100%)"></div>
        <div aria-hidden="true" style="position:absolute;right:-14%;top:-12%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(232,193,115,.22) 0%,rgba(232,193,115,0) 70%);animation:lg-glow 9s ease-in-out infinite"></div>

        <div style="position:relative;display:flex;align-items:center;gap:12px">
          <span style="width:46px;height:46px;flex:0 0 auto;border-radius:50%;background:#04060F;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(232,193,115,.4)">
            <img src="uploads/skpn-logo.png" alt="" width="34" height="34" style="display:block;width:34px;height:34px" />
          </span>
          <span style="font-family:'Noto Serif Devanagari',serif;font-size:15.5px;line-height:1.45;color:#FFF9EC">{{ t.asideOrg }}</span>
        </div>

        <div data-e="asidebody" style="position:relative;margin-top:auto;display:flex;flex-direction:column;gap:12px">
          <p style="margin:0;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#E8C173;line-height:1.9">{{ t.asideKicker }}</p>
          <h2 style="margin:0;font-family:'Noto Serif Devanagari',serif;font-weight:600;font-size:clamp(23px,2.5vw,30px);line-height:1.32;color:#FFF9EC;text-wrap:balance">{{ t.asideTitle }}</h2>
        </div>

        <div style="position:relative;padding-top:20px;border-top:1px solid rgba(232,193,115,.24);display:flex;flex-direction:column;gap:14px">
          <div data-e="asideslide" style="min-height:64px;display:flex;flex-direction:column;gap:5px;animation:{{ slideAnim }} .45s cubic-bezier(.22,.61,.36,1)">
            <span data-e="slidevalue" style="font-family:'Noto Serif Devanagari',serif;font-weight:600;font-size:26px;line-height:1.25;color:#E8C173;white-space:nowrap">{{ slide.value }}</span>
            <span style="font-size:15.5px;line-height:1.7;color:#C6CCDD">{{ slide.label }}</span>
          </div>
          <div aria-hidden="true" style="display:flex;gap:6px">
            <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
              <span style="width:{{ d.w }};height:4px;border-radius:2px;background:{{ d.bg }};transition:width .3s ease,background .3s ease"></span>
            </sc-for>
          </div>
        </div>
      </aside>

      <div data-e="form" style="padding:38px 36px;background:#FFFFFF;display:flex;flex-direction:column;gap:20px">
        <div>
          <h1 style="margin:0 0 8px;font-family:'Noto Serif Devanagari',serif;font-weight:600;font-size:clamp(25px,3.2vw,33px);line-height:1.3;color:#14203E">{{ t.title }}</h1>
          <p style="margin:0;font-size:17px;line-height:1.8;color:#565F72">{{ t.lede }}</p>
        </div>

        <a href="Profile.dc.html" onClick="{{ markSignedIn }}" style="min-height:58px;padding:16px 24px;border:1px solid #DCD1BC;border-radius:16px;background:#FCFAF4;display:flex;align-items:center;justify-content:center;gap:12px;font-size:17.5px;line-height:1.6;color:#161C2E;text-decoration:none" style-hover="background:#F1E9DA;color:#161C2E">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" style="display:block"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 01-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z" fill="#4285F4"></path><path d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1a5.9 5.9 0 01-5.6-4.1H3.1v2.6A10 10 0 0012 22z" fill="#34A853"></path><path d="M6.4 14a6 6 0 010-3.8V7.6H3.1a10 10 0 000 8.9L6.4 14z" fill="#FBBC05"></path><path d="M12 6.1c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 003.1 7.6l3.3 2.6A5.9 5.9 0 0112 6.1z" fill="#EA4335"></path></svg>
          {{ t.google }}
        </a>

        <div style="display:flex;align-items:center;gap:14px">
          <span style="height:1px;flex:1 1 auto;background:#E8DFCE"></span>
          <span style="font-size:15px;color:#6E6247">{{ t.or }}</span>
          <span style="height:1px;flex:1 1 auto;background:#E8DFCE"></span>
        </div>

        <sc-if value="{{ preSend }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:16px">
            <label style="display:flex;flex-direction:column;gap:7px">
              <span style="font-size:16px;line-height:1.6;color:#2E3646">{{ t.emailLabel }}</span>
              <input type="email" inputmode="email" autocomplete="email" value="{{ email }}" onInput="{{ onEmail }}" placeholder="name@gmail.com" style="min-height:54px;padding:14px 16px;border:1px solid {{ emailBorder }};border-radius:14px;background:#FCFAF4;font-size:17px;line-height:1.6;color:#161C2E" />
              <span style="font-size:15px;line-height:1.7;color:#A03A2B;display:{{ emailMsgDisplay }}">{{ emailMsg }}</span>
            </label>
            <button type="button" onClick="{{ send }}" style="min-height:56px;padding:16px 28px;border:0;border-radius:999px;background:#14203E;color:#FDF3DF;cursor:pointer;font-size:17.5px;font-weight:600;line-height:1.5">{{ t.sendCode }}</button>
          </div>
        </sc-if>

        <sc-if value="{{ sent }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:18px;background:#F6F0E4">
            <p style="margin:0;font-size:16.5px;line-height:1.8;color:#2E3646">{{ sentLine }}</p>
            <label style="display:flex;flex-direction:column;gap:7px">
              <span style="font-size:16px;line-height:1.6;color:#2E3646">{{ t.otpLabel }}</span>
              <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{ otp }}" onInput="{{ onOtp }}" placeholder="000000" style="min-height:56px;max-width:230px;padding:14px 16px;border:1px solid #DCD1BC;border-radius:14px;background:#FFFFFF;font-size:22px;letter-spacing:.32em;line-height:1.5;color:#161C2E;font-variant-numeric:tabular-nums" />
            </label>
            <a href="{{ verifyHref }}" onClick="{{ markSignedIn }}" style="min-height:56px;padding:16px 28px;border-radius:999px;background:{{ verifyBg }};color:{{ verifyFg }};display:flex;align-items:center;justify-content:center;font-size:17.5px;font-weight:600;line-height:1.5;pointer-events:{{ verifyEvents }};text-decoration:none">{{ t.verify }}</a>
            <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
              <span style="font-size:15px;line-height:1.7;color:#6E6247">{{ resendLine }}</span>
              <button type="button" onClick="{{ changeEmail }}" style="padding:0;border:0;background:none;cursor:pointer;font-size:15.5px;line-height:1.7;color:#27408B;text-decoration:underline">{{ t.changeEmail }}</button>
            </div>
          </div>
        </sc-if>

        <p style="margin:auto 0 0;padding-top:20px;border-top:1px solid #F0EADD;font-size:16.5px;line-height:1.8;color:#434C60">{{ t.noAccount }} <a href="Register.dc.html">{{ t.register }}</a></p>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,320px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1160}}">
const S = {
  hi: {
    title: "साइन इन",
    lede: "जिस ईमेल से पंजीकरण किया था, उसी से साइन इन करें।",
    asideOrg: "श्रीकृष्ण पाथेय न्यास, भोपाल",
    asideKicker: "गुरु पूर्णिमा, 29 जुलाई 2026",
    asideTitle: "भगवान श्रीकृष्ण मेधावी छात्रवृत्ति प्रतियोगिता",
    slides: [
      { value: "₹1,00,000", label: "एकमुश्त छात्रवृत्ति" },
      { value: "102 विद्यार्थी", label: "51 विद्यालय एवं 51 महाविद्यालय स्तर" },
      { value: "30 प्रश्न", label: "10 मिनट, ऋणात्मक अंकन नहीं" },
      { value: "निःशुल्क", label: "कक्षा 9 से महाविद्यालय तक" }
    ],
    google: "Google से जारी रखें",
    or: "अथवा",
    emailLabel: "ईमेल पता",
    emailInvalid: "पूरा ईमेल पता लिखें, जैसे name@gmail.com",
    sendCode: "6 अंकों का कोड भेजें",
    sentPrefix: "कोड भेजा गया",
    otpLabel: "ईमेल पर आया कोड",
    verify: "सत्यापित करें",
    resend: "पुनः भेजें",
    changeEmail: "ईमेल बदलें",
    noAccount: "खाता नहीं है?",
    register: "पंजीकरण करें"
  },
  en: {
    title: "Sign in",
    lede: "Sign in with the same email you registered with.",
    asideOrg: "Shri Krishna Pathey Nyas, Bhopal",
    asideKicker: "Guru Purnima, 29 July 2026",
    asideTitle: "Bhagwan Shri Krishna Medhavi Chhatravritti Pratiyogita",
    slides: [
      { value: "₹1,00,000", label: "One-time scholarship" },
      { value: "102 students", label: "51 school and 51 college level" },
      { value: "30 questions", label: "10 minutes, no negative marking" },
      { value: "Free", label: "Class 9 to college" }
    ],
    google: "Continue with Google",
    or: "or",
    emailLabel: "Email address",
    emailInvalid: "Enter a complete email address, for example name@gmail.com",
    sendCode: "Send a 6-digit code",
    sentPrefix: "Code sent to",
    otpLabel: "Code from your email",
    verify: "Verify",
    resend: "Resend",
    changeEmail: "Change email address",
    noAccount: "No account yet?",
    register: "Register"
  }
};

class Component extends DCLogic {
  state = { lang: null, email: "", touched: false, sent: false, otp: "", slide: 0 };

  componentDidMount() {
    try { const saved = localStorage.getItem("skpn_lang"); if (saved === "hi" || saved === "en") this.setState({ lang: saved }); } catch (e) {}
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    this._rot = setInterval(() => this.setState(s => ({ slide: s.slide + 1 })), 2000);
  }
  componentWillUnmount() { if (this._rot) clearInterval(this._rot); }

  get lang() { return this.state.lang || this.props.language || "hi"; }

  renderVals() {
    const lang = this.lang, t = S[lang], s = this.state;
    const bad = s.touched && s.email.trim() && !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(s.email.trim());
    const ready = s.otp.length === 6;
    const i = s.slide % t.slides.length;
    return {
      lang: lang,
      t: t,
      slide: t.slides[i],
      slideAnim: s.slide % 2 === 0 ? "lg-inA" : "lg-inB",
      dots: t.slides.map((_, n) => ({ w: n === i ? "22px" : "8px", bg: n === i ? "#E8C173" : "rgba(232,193,115,.32)" })),
      email: s.email,
      onEmail: e => this.setState({ email: e.target.value, touched: true }),
      emailBorder: bad ? "#A03A2B" : "#DCD1BC",
      emailMsg: bad ? t.emailInvalid : "",
      emailMsgDisplay: bad ? "block" : "none",
      preSend: !s.sent,
      sent: s.sent,
      send: () => { if (!bad && s.email.trim()) this.setState({ sent: true }); },
      sentLine: t.sentPrefix + " " + s.email.trim(),
      otp: s.otp,
      onOtp: e => this.setState({ otp: e.target.value.replace(/\D/g, "").slice(0, 6) }),
      verifyHref: ready ? "Profile.dc.html" : "#",
      verifyBg: ready ? "#14203E" : "#EDE6D7",
      verifyFg: ready ? "#FDF3DF" : "#7C8494",
      verifyEvents: ready ? "auto" : "none",
      markSignedIn: () => { try { localStorage.setItem("skpn_signed_in", "1"); } catch (e) {} },
      resendLine: t.resend + " 00:30",
      changeEmail: () => this.setState({ sent: false, otp: "" }),
      toggleLang: () => {
        const next = this.lang === "hi" ? "en" : "hi";
        try { localStorage.setItem("skpn_lang", next); } catch (e) {}
        this.setState({ lang: next });
      }
    };
  }
}

</script>
</body>
</html>
