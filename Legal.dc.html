<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #FBF7F0; }
  * { box-sizing: border-box; }
  a { color: #27408B; text-decoration: none; }
  a:hover { color: #8A6015; }
  button:focus-visible, a:focus-visible { outline: 3px solid #27408B; outline-offset: 2px; }
  @media (max-width: 980px) {
    [data-g="foot"] { grid-template-columns: minmax(0,1fr) !important; gap: 30px !important; }
    [data-e~="nav"], [data-e~="signin-top"] { display: none !important; }
    [data-e~="menu-btn"] { display: inline-flex !important; }
  }
  @media (max-width: 640px) {
    [data-e~="pad"] { padding-left: 18px !important; padding-right: 18px !important; }
    [data-e~="card"] { padding: 24px 20px !important; }
  }
</style>
<script src="assets/site.js"></script>
</helmet>

<div style="background:#FBF7F0;color:#161C2E;font-family:'Noto Sans Devanagari',system-ui,sans-serif;min-width:320px;overflow-x:hidden">
  <dc-import name="SiteHeader" lang="{{ lang }}" active="home" on-toggle-lang="{{ toggleLang }}" hint-size="100%,68px"></dc-import>

  <section data-e="pad" style="max-width:880px;margin:0 auto;padding:48px 30px 78px">
    <div role="tablist" style="display:flex;gap:24px;border-bottom:1px solid #E8DFCE;margin-bottom:34px">
      <button type="button" role="tab" aria-selected="{{ privacyOn }}" onClick="{{ showPrivacy }}" style="padding:10px 2px 14px;min-height:48px;background:none;border:0;border-bottom:2px solid {{ privacyLine }};cursor:pointer;font-family:'Noto Serif Devanagari',serif;font-size:18.5px;line-height:1.5;color:{{ privacyFg }}">{{ t.privacyTab }}</button>
      <button type="button" role="tab" aria-selected="{{ termsOn }}" onClick="{{ showTerms }}" style="padding:10px 2px 14px;min-height:48px;background:none;border:0;border-bottom:2px solid {{ termsLine }};cursor:pointer;font-family:'Noto Serif Devanagari',serif;font-size:18.5px;line-height:1.5;color:{{ termsFg }}">{{ t.termsTab }}</button>
    </div>

    <h1 style="margin:0 0 12px;font-family:'Noto Serif Devanagari',serif;font-weight:600;font-size:clamp(25px,3.6vw,34px);line-height:1.3;color:#14203E">{{ doc.title }}</h1>
    <p style="margin:0 0 32px;max-width:60ch;font-size:17.5px;line-height:1.85;color:#434C60">{{ doc.lede }}</p>

    <div style="display:flex;flex-direction:column;gap:22px">
      <sc-for list="{{ doc.sections }}" as="s" hint-placeholder-count="6">
        <section data-e="card" style="padding:26px 30px;background:#FFFFFF;border-radius:20px;box-shadow:0 2px 4px rgba(20,32,62,.05),0 12px 28px rgba(20,32,62,.05)">
          <h2 style="margin:0 0 12px;font-family:'Noto Serif Devanagari',serif;font-weight:600;font-size:20px;line-height:1.45;color:#14203E">{{ s.title }}</h2>
          <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px">
            <sc-for list="{{ s.points }}" as="p" hint-placeholder-count="3">
              <li style="display:flex;gap:12px;align-items:flex-start">
                <span aria-hidden="true" style="margin-top:9px;width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:#E8C173"></span>
                <span style="font-size:17px;line-height:1.85;color:#2E3646">{{ p }}</span>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-for>
    </div>

    <p style="margin:26px 0 0;padding:20px 24px;border-left:3px solid #8A6015;border-radius:0 16px 16px 0;background:#F4EBD8;font-size:16.5px;line-height:1.85;color:#3D3524">{{ doc.pending }}</p>
    <p style="margin:20px 0 0;font-size:16.5px;line-height:1.8;color:#434C60">{{ t.questions }} <a href="About.dc.html#sampark">{{ t.contactLink }}</a></p>
  </section>

  <dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,300px"></dc-import>
</div>

</x-dc>

class Component extends DCLogic {
  state = { lang: null, doc: null };

  componentDidMount() {
    try { const saved = localStorage.getItem("skpn_lang"); if (saved === "hi" || saved === "en") this.setState({ lang: saved }); } catch (e) {}
    try {
      const q = new URLSearchParams(window.location.search).get("doc");
      if (q === "terms" || q === "privacy") this.setState({ doc: q });
    } catch (e) {}
  }

  get lang() { return this.state.lang || this.props.language || "hi"; }
  get doc() { return this.state.doc || this.props.doc || "privacy"; }

  renderVals() {
    const lang = this.lang, t = S[lang];
    const isPrivacy = this.doc !== "terms";
    return {
      lang: lang,
      t: t,
      doc: isPrivacy ? t.privacy : t.terms,
      privacyOn: isPrivacy, termsOn: !isPrivacy,
      privacyFg: isPrivacy ? "#14203E" : "#565F72",
      termsFg: isPrivacy ? "#565F72" : "#14203E",
      privacyLine: isPrivacy ? "#8A6015" : "transparent",
      termsLine: isPrivacy ? "transparent" : "#8A6015",
      showPrivacy: () => this.setState({ doc: "privacy" }),
      showTerms: () => this.setState({ doc: "terms" }),
      toggleLang: () => {
        const next = lang === "hi" ? "en" : "hi";
        try { localStorage.setItem("skpn_lang", next); } catch (e) {}
        this.setState({ lang: next });
      }
    };
  }
}

</body>
</html>
